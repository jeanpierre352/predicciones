<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practicante Login - Sistema Tareas</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/clouds/100/000000/task.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .main-wrapper {
            display: flex; background: white; border-radius: 20px; 
            width: 900px; max-width: 100%; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-section { flex: 1; padding: 50px; border-right: 1px solid #eee; }
        .list-section { width: 350px; background: #f8f9fa; padding: 30px; }
        
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        
        button {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;
        }
        
        .practicantes-scroll {
            height: 400px; overflow-y: auto; margin-top: 15px;
            padding-right: 10px;
        }
        .p-item {
            padding: 10px; background: white; border-radius: 8px;
            margin-bottom: 10px; border: 1px solid #ddd; font-size: 13px;
        }
        .p-item strong { color: #16213e; display: block; }
        .p-item span { color: #888; font-size: 11px; }

        .error-msg { color: #d9534f; background: #f9ebeb; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .back-link { display: block; margin-top: 20px; color: #f5576c; text-decoration: none; font-size: 14px; text-align: center; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Izquierda: Formulario -->
        <div class="login-section">
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <img src="https://img.icons8.com/clouds/100/000000/task.png" alt="Logo" style="width: 60px; height: 60px; margin-right: 10px;">
                <h1>Practicante</h1>
            </div>
            <p class="subtitle">Ingresa con tu correo institucional</p>
            
            {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" action="/login_practicante">
                <div class="input-group">
                    <label>Tu Email:</label>
                    <input type="email" name="email" placeholder="ejemplo@correo.com" required autofocus>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <a href="/" class="back-link">⬅ Volver al inicio</a>
            
            <div style="margin-top: 40px; font-size: 10px; color: #ccc; text-align: center;">
                Powered by Random Forest Regressor
            </div>
        </div>

        <!-- Derecha: Lista de Practicantes -->
        <div class="list-section">
            <h3 style="color: #333; font-size: 16px; margin-bottom: 15px;">👥 Directorio de Acceso</h3>
            <p style="font-size: 12px; color: #777; margin-bottom: 10px;">Copia tu correo de la lista:</p>
            
            <div class="practicantes-scroll">
                {% for p in practicantes %}
                <div class="p-item">
                    <strong>{{ p.nombre }}</strong>
                    <span>{{ p.email }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
